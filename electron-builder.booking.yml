appId: com.meldcx.booking
productName: MeldPOST Booking
extraMetadata:
  name: meldpost-booking
  productName: MeldPOST Booking
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: MeldPOST Booking
  icon: icon.ico
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  signAndEditExecutable: true
nsis:
  artifactName: MeldPOSTBooking-${version}-${arch}-setup.${ext}
  installerIcon: icon.ico
  installerHeaderIcon: icon.ico
  uninstallerIcon: icon.ico
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: build/icon.png
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: MeldPOSTBooking-${version}.${ext}
linux:
  icon: build/icon.png
  target:
    - AppImage
    - snap
    - deb
  maintainer: meldcx.com
  category: Utility
appImage:
  artifactName: MeldPOSTBooking-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://meldcx.com/auto-updates
